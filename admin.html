<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель | VARTA GEAR</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
    <div id="admin-login-screen" class="admin-login-screen">
        <div class="admin-login-card">
            <h1><i class="fas fa-shield-alt"></i> VARTA GEAR ADMIN</h1>
            <p>Доступ лише для адміністраторів</p>
            <input type="email" id="admin-email" placeholder="Email">
            <input type="password" id="admin-password" placeholder="Пароль">
            <button onclick="adminLogin()" class="admin-btn-primary">Увійти</button>
            <button onclick="adminLoginGoogle()" class="admin-btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="">
                Google
            </button>
            <p id="admin-login-msg" class="admin-msg"></p>
            <a href="index.html" class="admin-back-link"><i class="fas fa-arrow-left"></i> На сайт</a>
        </div>
    </div>

    <div id="admin-dashboard" class="admin-dashboard" style="display:none;">
        <aside class="admin-sidebar">
            <div class="admin-logo">VARTA <span>ADMIN</span></div>
            <nav class="admin-nav">
                <button class="admin-nav-item active" data-tab="orders" onclick="switchAdminTab('orders')">
                    <i class="fas fa-box"></i> Замовлення
                </button>
                <button class="admin-nav-item" data-tab="clients" onclick="switchAdminTab('clients')">
                    <i class="fas fa-users"></i> Клієнти
                </button>
                <button class="admin-nav-item" data-tab="promos" onclick="switchAdminTab('promos')">
                    <i class="fas fa-tag"></i> Промокоди
                </button>
            </nav>
            <div class="admin-sidebar-footer">
                <span id="admin-user-email"></span>
                <button onclick="adminLogout()" class="admin-logout"><i class="fas fa-sign-out-alt"></i> Вийти</button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h2 id="admin-page-title">Замовлення</h2>
                <a href="index.html" class="admin-site-link"><i class="fas fa-external-link-alt"></i> Сайт</a>
            </header>

            <!-- ЗАМОВЛЕННЯ -->
            <section id="admin-tab-orders" class="admin-tab active">
                <div class="admin-filters">
                    <select id="order-status-filter" onchange="loadAdminOrders()">
                        <option value="all">Всі статуси</option>
                        <option value="new">Нові</option>
                        <option value="confirmed">Підтверджені</option>
                        <option value="processing">В обробці</option>
                        <option value="shipped">Відправлені</option>
                        <option value="delivered">Доставлені</option>
                        <option value="cancelled">Скасовані</option>
                    </select>
                    <button onclick="loadAdminOrders()" class="admin-btn-sm"><i class="fas fa-sync"></i> Оновити</button>
                </div>
                <div id="admin-orders-table" class="admin-table-wrap"></div>
            </section>

            <!-- КЛІЄНТИ -->
            <section id="admin-tab-clients" class="admin-tab">
                <div class="admin-search-row">
                    <input type="text" id="client-search" placeholder="Пошук за email або ім'ям..." oninput="filterClients()">
                </div>
                <div id="admin-clients-table" class="admin-table-wrap"></div>
            </section>

            <!-- ПРОМОКОДИ -->
            <section id="admin-tab-promos" class="admin-tab">
                <div class="admin-promo-form">
                    <h3>Створити промокод</h3>
                    <div class="admin-form-grid">
                        <input type="text" id="new-promo-code" placeholder="Код (напр. VIP20)">
                        <input type="number" id="new-promo-discount" placeholder="Знижка %" min="1" max="100">
                        <input type="text" id="new-promo-desc" placeholder="Опис">
                        <input type="number" id="new-promo-max-uses" placeholder="Макс. використань (опц.)">
                        <input type="email" id="new-promo-user-email" placeholder="Email клієнта (персональний, опц.)">
                        <input type="date" id="new-promo-expires" placeholder="Термін дії">
                        <button onclick="createPromoCode()" class="admin-btn-primary"><i class="fas fa-plus"></i> Створити</button>
                    </div>
                </div>
                <div id="admin-promos-table" class="admin-table-wrap"></div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>
</html>
